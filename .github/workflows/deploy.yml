name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets you re-deploy from the Actions tab without pushing a commit.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; queue instead, and drop superseded runs.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - run: npm i

      - name: Inject Gemini API key
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/inject-gemini-key.mjs

      # base-href is derived from the repo name so the app resolves its hashed
      # bundles under https://<user>.github.io/<repo>/ — a plain "/" would 404.
      - name: Build
        run: npm run build -- --configuration production --base-href "/${{ github.event.repository.name }}/"

      # Stops GitHub's Jekyll pass from dropping files that start with "_".
      - name: Disable Jekyll processing
        run: touch dist/advocate-rti-assistant/browser/.nojekyll

      # `enablement: true` turns Pages on for the repo the first time this runs,
      # instead of failing with "Get Pages site failed / Not Found". Needs the
      # `pages: write` permission granted above. Harmless once Pages is on.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/advocate-rti-assistant/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
